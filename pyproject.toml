[project]
name = "alphasutra-quant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "mypy>=1.15,<2", "httpx>=0.28,<1", "pandas-stubs>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["services/quant"]
testpaths = ["services/quant/tests"]
addopts = "--basetemp=.cache/pytest"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["services/quant/quant"]
ignore_missing_imports = true
check_untyped_defs = true
